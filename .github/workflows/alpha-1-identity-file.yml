name: Alpha 1 encrypted identity file

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/alpha-1-encrypted-identity-file

permissions:
  contents: read

jobs:
  alpha-1-identity-file:
    name: Alpha 1 encrypted identity file
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      # actions/checkout release v7.0.0
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # actions/setup-node release v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install pinned official age test binary
        env:
          AGE_RELEASE: 1.3.1
          AGE_ARCHIVE_SHA256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
        run: |
          archive_path="$RUNNER_TEMP/age-v${AGE_RELEASE}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_RELEASE}/age-v${AGE_RELEASE}-linux-amd64.tar.gz" \
            --output "$archive_path"
          echo "${AGE_ARCHIVE_SHA256}  ${archive_path}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive_path" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/age/age" --version

      - name: Install pinned Playwright browser toolchain
        run: npx playwright install --with-deps chromium firefox

      - name: Run shared formatting, syntax, unit, and policy checks
        run: npm run check

      - name: Run Alpha 1 identity-file unit and policy checks
        run: npm run test:identity-file:unit

      - name: Run Alpha 1 Chromium identity continuity checks
        run: npm run test:identity-file:chromium

      - name: Run Alpha 1 Firefox identity continuity checks
        run: npm run test:identity-file:firefox

      - name: Record real-profile Chromium and Firefox KDF observations
        run: npm run measure:identity-file

      - name: Run complete Alpha unit and policy checks
        run: npm run test:alpha:unit

      - name: Run complete Alpha Chromium checks
        run: npm run test:alpha:chromium

      - name: Run complete Alpha Firefox checks
        run: npm run test:alpha:firefox

      - name: Build and inspect Alpha output
        run: |
          npm run alpha:build
          npm run check:alpha-build

      - name: Reject common committed credential markers
        run: |
          if git grep -n -E 'BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}' -- . ':(exclude).github/workflows/alpha-1-identity-file.yml'; then
            echo 'Potential credential material detected.' >&2
            exit 1
          fi

      - name: Run dependency audits
        run: |
          npm audit
          npm audit --omit=dev
