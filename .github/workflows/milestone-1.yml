name: Milestone 1 laboratory

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/milestone-1-cli-comparison

permissions:
  contents: read

jobs:
  laboratory:
    name: Milestone 1 laboratory
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # actions/checkout release v7.0.0
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # actions/setup-node release v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install pinned official age test binary
        env:
          AGE_RELEASE: 1.3.1
          AGE_ARCHIVE_SHA256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
        run: |
          archive_path="$RUNNER_TEMP/age-v${AGE_RELEASE}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_RELEASE}/age-v${AGE_RELEASE}-linux-amd64.tar.gz" \
            --output "$archive_path"
          echo "${AGE_ARCHIVE_SHA256}  ${archive_path}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive_path" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/age/age" --version

      - name: Run formatting, syntax, unit, and interoperability checks
        run: npm run check
