name: Alpha 0 browser envelope

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/alpha-0-browser-envelope

permissions:
  contents: read

jobs:
  alpha-browser-envelope:
    name: Alpha 0 browser envelope
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      # actions/checkout release v7.0.0
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # actions/setup-node release v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install pinned official age test binary
        env:
          AGE_RELEASE: 1.3.1
          AGE_ARCHIVE_SHA256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
        run: |
          archive_path="$RUNNER_TEMP/age-v${AGE_RELEASE}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_RELEASE}/age-v${AGE_RELEASE}-linux-amd64.tar.gz" \
            --output "$archive_path"
          echo "${AGE_ARCHIVE_SHA256}  ${archive_path}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive_path" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/age/age" --version

      - name: Install pinned Playwright browser toolchain
        run: npx playwright install --with-deps chromium firefox

      - name: Run shared formatting, syntax, unit, and policy checks
        run: npm run check

      - name: Run Milestone 1 interoperability checks
        run: npm run test:interop

      - name: Run Milestone 2A Chromium checks
        run: npm run test:browser:chromium

      - name: Run Milestone 2A Firefox checks
        run: npm run test:browser:firefox

      - name: Run Milestone 2A cross-runtime checks
        run: npm run test:cross-runtime

      - name: Build and inspect Milestone 2A output
        run: |
          npm run lab:2a:build
          npm run check:browser-build

      - name: Run Milestone 2B unit and QR checks
        run: |
          npm run test:study:unit
          npm run test:study:qr

      - name: Run Milestone 2B Chromium checks
        run: npm run test:study:chromium

      - name: Run Milestone 2B Firefox checks
        run: npm run test:study:firefox

      - name: Build and inspect Milestone 2B output
        run: |
          npm run lab:2b:build
          npm run check:study-build

      - name: Run Alpha 0 unit and policy checks
        run: npm run test:alpha:unit

      - name: Run Alpha 0 Chromium checks
        run: npm run test:alpha:chromium

      - name: Run Alpha 0 Firefox checks
        run: npm run test:alpha:firefox

      - name: Build and inspect Alpha 0 output
        run: |
          npm run alpha:build
          npm run check:alpha-build

      - name: Run dependency audits
        run: |
          npm audit
          npm audit --omit=dev
