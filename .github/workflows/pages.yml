name: GitHub Pages preview

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # actions/checkout release v7.0.0
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # actions/setup-node release v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install pinned official age test binary
        env:
          AGE_RELEASE: 1.3.1
          AGE_ARCHIVE_SHA256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
        run: |
          archive_path="$RUNNER_TEMP/age-v${AGE_RELEASE}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_RELEASE}/age-v${AGE_RELEASE}-linux-amd64.tar.gz" \
            --output "$archive_path"
          echo "${AGE_ARCHIVE_SHA256}  ${archive_path}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive_path" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/age/age" --version

      - name: Run shared checks
        run: npm run check

      - name: Run complete preview unit and policy checks
        run: npm run test:alpha:unit

      - name: Build and inspect repository-path artifact
        env:
          CIPHERBOOK_BASE_PATH: /CipherBook/
          CIPHERBOOK_BUILD_LABEL: development-preview
          CIPHERBOOK_BUILD_COMMIT: ${{ github.sha }}
        run: |
          npm run alpha:build
          npm run check:alpha-build

      # actions/configure-pages release v6.0.0
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      # actions/upload-pages-artifact release v5.0.0
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: alpha/web/dist

  deploy:
    name: Deploy Pages preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # actions/deploy-pages release v5.0.0
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
